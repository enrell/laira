[package]
name = "laira-identity"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = "2"
sha2 = "0.11.0"
hmac = "0.13.0"
rand = "0.9"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hkdf = "0.13.0"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.11.1"
